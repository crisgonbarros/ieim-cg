<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Em construção · IEIM Campo Grande</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@500&display=swap">
<style>
  :root { --preto: #000; --branco: #fff; --linha: #e6e6e6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--branco);
    color: var(--preto);
    font-family: "Raleway", system-ui, sans-serif;
    font-weight: 500;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  main { display: grid; justify-items: center; gap: 40px; text-align: center; }
  img { width: clamp(140px, 36vw, 220px); height: auto; display: block; }
  h1 { font-size: clamp(1.05rem, 3.2vw, 1.3rem); font-weight: 500; letter-spacing: 0.04em; }
  .barra {
    width: clamp(160px, 40vw, 240px);
    height: 3px;
    background: var(--linha);
    border-radius: 3px;
    overflow: hidden;
  }
  .barra span {
    display: block;
    width: 40%;
    height: 100%;
    background: var(--preto);
    border-radius: 3px;
    animation: carregar 1.6s ease-in-out infinite;
  }
  @keyframes carregar {
    0%   { transform: translateX(-100%); opacity: .35; }
    50%  { opacity: 1; }
    100% { transform: translateX(250%); opacity: .35; }
  }
  @media (prefers-reduced-motion: reduce) {
    .barra span { animation: pulsar 2s ease-in-out infinite; width: 100%; transform: none; }
    @keyframes pulsar { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  }
</style>
</head>
<body>
<main>
  <img src="/img/logo_ieim_simbolo_preto.svg" alt="IEIM" width="220" height="145">
  <h1>Página em construção</h1>
  <div class="barra" role="progressbar" aria-label="Carregando"><span></span></div>
</main>
</body>
</html>
